# Local test environment for mod_videoai and local_videotranscriber: Moodle 4.5 + PostgreSQL + FFmpeg 8 with Whisper.
# Start everything with ./setup.sh (see README.md). Moodle's code lives in a Docker volume: it is cloned from GitHub,
# or copied from an existing checkout if MOODLE_SRC points to one (in spike/.env). The plugins are bind-mounted
# from this repository, so edits are live.
#
# Settings (spike/.env or environment): MOODLE_PORT (8000), TRANSCRIBER_PORT (8001), MOODLE_SRC, MODELS_VOLUME.
name: videoai-spike

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - dbdata:/var/lib/postgresql/data

  webserver:
    build: .
    image: videoai-spike-web
    depends_on: [db]
    ports:
      - "${MOODLE_PORT:-8000}:80"
    environment:
      MOODLE_WWWROOT: "http://localhost:${MOODLE_PORT:-8000}"
      # Videos are uploaded through the browser, so the 200M image default is too low.
      PHP_INI-upload_max_filesize: 2G
      PHP_INI-post_max_size: 2G
      PHP_INI-memory_limit: 512M
    volumes:
      # Optional existing Moodle 4.5 checkout, copied into the moodlecode volume by bench/sync_code.sh (running
      # Moodle straight from a Windows bind mount is roughly 10x slower). Without one, sync_code.sh clones Moodle.
      - "${MOODLE_SRC:-./moodle-src}:/moodle-src:ro"
      - moodlecode:/var/www/html
      - "./config.php:/var/www/html/config.php:ro"
      - "../videoai:/var/www/html/mod/videoai"
      - "../local_videotranscriber:/var/www/html/local/videotranscriber"
      - "./bench:/bench"
      - samplesdata:/samples
      # Whisper models for the FFmpeg whisper filter (downloaded by setup.sh), and the comparison results folder.
      - whispermodels:/models
      - "./asr:/asr"
      - moodledata:/var/www/moodledata
      - phpunitdata:/var/www/phpunitdata

  # Optional external transcription service (../transcriber), for the "External service" engine:
  #   docker compose --profile service up -d transcriber
  # Moodle reaches it at http://transcriber:8000. It downloads its model (1.6 GB) on first start.
  transcriber:
    profiles: [service]
    build: ../transcriber
    image: videoai-transcriber
    environment:
      API_KEY: spike-secret
      WHISPER_THREADS: "8"
      MODEL_DIR: /models/faster-whisper
    volumes:
      - whispermodels:/models
    ports:
      - "${TRANSCRIBER_PORT:-8001}:8000"

  # Only for building the test video set: docker compose --profile tools run --rm tools sh samples/make_samples.sh
  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.tools
    image: videoai-spike-tools
    volumes:
      - "./samples:/work/samples"
      - samplesdata:/samples

volumes:
  whispermodels:
    # Lets an existing model volume be reused (MODELS_VOLUME in .env), e.g. the one from the asr/ comparison.
    name: ${MODELS_VOLUME:-videoai-whisper-models}
  samplesdata:
  dbdata:
  moodlecode:
  moodledata:
  phpunitdata:
